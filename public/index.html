<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Vanilla Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>todos</h1>
    <form id="new-form" autocomplete="off">
      <input id="toggle-all" type="checkbox" aria-label="Mark all as done" hidden>
      <input id="new-title" type="text" placeholder="What needs doing?" aria-label="New todo" autofocus>
      <input id="new-due" type="date" aria-label="Due date (optional)">
    </form>
    <ul id="list"></ul>
    <footer id="footer" hidden>
      <span id="count" role="status" aria-live="polite"></span>
      <nav id="filters" aria-label="Filter">
        <a href="#/" data-filter="all">All</a>
        <a href="#/active" data-filter="active">Active</a>
        <a href="#/completed" data-filter="completed">Completed</a>
      </nav>
      <button id="clear-completed" type="button">Clear completed</button>
    </footer>
  </main>
  <script src="js/todos.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
