<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vanilla Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>todos</h1>
    <form id="new-form" autocomplete="off">
      <input id="new-title" type="text" placeholder="What needs doing?" aria-label="New todo" autofocus>
    </form>
    <ul id="list"></ul>
    <footer id="footer" hidden>
      <nav id="filters" aria-label="Filter">
        <a href="#/" data-filter="all">All</a>
        <a href="#/active" data-filter="active">Active</a>
        <a href="#/completed" data-filter="completed">Completed</a>
      </nav>
    </footer>
  </main>
  <script src="js/todos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
